# Caddy build with the Cloudflare DNS module (official build from caddyserver.com).
# No --environ: it would print CF_API_TOKEN to the journal.
[Service]
EnvironmentFile=/etc/caddy/cloudflare.env
ExecStart=
ExecStart=/usr/local/bin/caddy-cloudflare run --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/local/bin/caddy-cloudflare reload --config /etc/caddy/Caddyfile --force
